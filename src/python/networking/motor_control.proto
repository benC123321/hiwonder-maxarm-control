syntax = "proto3";

package motor_control;

service MotorControlService {
  rpc SendCommand (MotorCommandRequest) returns (MotorCommandResponse);
  rpc ToggleGPIO  (GPIOToggleRequest)   returns (GPIOToggleResponse);
}

message MotorCommandRequest {
  int32 motor_id = 1;
  int32 position  = 2;
  int32 move_time = 3;
}

message MotorCommandResponse {
  bool   success = 1;
  string message = 2;
}

message GPIOToggleRequest {}

message GPIOToggleResponse {
  bool   success   = 1;
  string message   = 2;
  bool   pin_state = 3;
}
